<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-label="Meridian Institute of Technology">
  <defs>
    <linearGradient id="mrdLogin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <g transform="translate(6,6)">
    <circle cx="22" cy="22" r="21" fill="none" stroke="url(#mrdLogin)" stroke-width="3"/>
    <ellipse cx="22" cy="22" rx="9" ry="21" fill="none" stroke="url(#mrdLogin)" stroke-width="2.4" opacity="0.85"/>
    <path d="M1 22 H43" stroke="url(#mrdLogin)" stroke-width="2.4" opacity="0.55"/>
    <circle cx="22" cy="22" r="4" fill="url(#mrdLogin)"/>
  </g>

  <!-- White wordmark. The login hero panel is the near-black night surface, so the
       dark-text lockup used here previously rendered as invisible text on ink.
       NOTE: never write a double hyphen inside an SVG comment. XML forbids it, and
       Chromium refuses to parse the whole file, which surfaces as a broken image
       with a 200 response and correct content-type. -->
  <g fill="#ffffff" font-family="Satoshi, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="62" y="30" font-size="21" font-weight="700" letter-spacing="0.6">MERIDIAN</text>
    <text x="63" y="44" font-size="9" font-weight="500" letter-spacing="2.3" opacity="0.78">INSTITUTE OF TECHNOLOGY</text>
  </g>
</svg>
